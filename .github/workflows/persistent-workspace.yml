name: Validate persistent workspace
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container: mcr.microsoft.com/playwright/python:v1.63.0-noble
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned browser test library
        run: pip install playwright==1.63.0
      - name: Build the device-library frontend
        run: python tools/integrate_workspace.py
      - name: Native IndexedDB and two-browser UI regression
        run: python tests/workspace_e2e.py
      - name: Save synthetic-only test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persistent-workspace-validation
          path: |
            test-results/workspace/
            site/js/app.js
            site/js/local-store.js
            site/js/workspace-ui.js
            site/index.html
          retention-days: 14
