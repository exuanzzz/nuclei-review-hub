name: Deploy review frontend
on:
  push:
    branches: [main, feature/image-navigation-self-registration, feature/public-self-registration]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container: mcr.microsoft.com/playwright/python:v1.63.0-noble
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned native-browser test library
        run: pip install playwright==1.63.0
      - name: Build persistent local library and review controls
        run: |
          python tools/integrate_workspace.py
          python tools/add_select_all.py
          python tools/add_image_navigation.py
          python tools/add_open_signup.py
      - name: Test reload, browser restart, backups and bulk operations
        run: python tests/workspace_e2e.py
      - name: Test Select all across full image lists, comments and Trash
        run: python tests/select_all_ui.py
      - name: Test Previous and Next, filters, draft safety and shared version links
        run: python tests/image_navigation_ui.py
      - name: Test public registration and first-login enrollment with mocked Auth only
        run: python tests/open_signup_ui.py
      - name: Retain synthetic-only validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-validation
          path: |
            test-results/workspace/
            test-results/select-all/
            test-results/navigation/
            test-results/registration/
            site/js/app.js
            site/js/cloud.js
            site/js/local-store.js
            site/js/workspace-ui.js
            site/js/field-navigation.js
            site/js/signup-ui.js
            site/index.html
          retention-days: 14
      - name: Package only the tested frontend
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  enrollment:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: nuclei_registration_test
        options: >-
          --health-cmd "pg_isready -U postgres -d nuclei_registration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - name: Test enrollment in a disposable PostgreSQL instance only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/registration-sql
          docker cp tests "${{ job.services.postgres.id }}:/tmp/nuclei-tests"
          docker cp supabase "${{ job.services.postgres.id }}:/tmp/supabase"
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -d nuclei_registration_test -f /tmp/nuclei-tests/open_signup.sql 2>&1 | tee test-results/registration-sql/log.txt
      - name: Retain enrollment test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registration-database-validation
          path: test-results/registration-sql/
          retention-days: 14
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, enrollment]
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deployment
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy validated frontend
        uses: actions/deploy-pages@v4
        id: deployment
