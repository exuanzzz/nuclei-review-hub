name: Deploy review frontend
on:
  push:
    branches: [main, feature/image-navigation-self-registration]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container: mcr.microsoft.com/playwright/python:v1.63.0-noble
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned native-browser test library
        run: pip install playwright==1.63.0
      - name: Build persistent local library and bulk review controls
        run: |
          python tools/integrate_workspace.py
          python tools/add_select_all.py
          python tools/add_image_navigation.py
      - name: Test reload, browser restart, backups and bulk operations
        run: python tests/workspace_e2e.py
      - name: Test Select all across full image lists, comments and Trash
        run: python tests/select_all_ui.py
      - name: Test Previous and Next, filters, draft safety and shared version links
        run: python tests/image_navigation_ui.py
      - name: Retain synthetic-only validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-validation
          path: |
            test-results/workspace/
            test-results/select-all/
            test-results/navigation/
            site/js/app.js
            site/js/local-store.js
            site/js/workspace-ui.js
            site/js/field-navigation.js
            site/index.html
          retention-days: 14
      - name: Package only the tested frontend
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deployment
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy validated frontend
        uses: actions/deploy-pages@v4
        id: deployment
